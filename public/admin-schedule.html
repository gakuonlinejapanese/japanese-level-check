<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GAKU 先生用スケジュール管理</title>
<style>
  :root { --ink:#1e293b; --green:#16a34a; --red:#dc2626; --amber:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif; background:#f8fafc; color:var(--ink); }
  header { background:#1e293b; color:#fff; padding:18px 24px; }
  header h1 { margin:0; font-size:18px; }
  .wrap { max-width:1000px; margin:0 auto; padding:24px; }
  section { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:18px; margin-bottom:22px; }
  h2 { font-size:15px; margin:0 0 14px; }
  .req-card { border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .req-head { display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:700; }
  .opt-row { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:13px; }
  .badge { padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700; }
  .badge.pending { background:#fef3c7; color:var(--amber); }
  .badge.confirmed { background:#dcfce7; color:var(--green); }
  .badge.no_availability { background:#fee2e2; color:var(--red); }
  .opt-btn { padding:5px 10px; border-radius:6px; border:none; font-size:12px; font-weight:700; cursor:pointer; }
  .opt-btn.avail { background:var(--green); color:#fff; }
  .opt-btn.taken { background:#e2e8f0; color:#94a3b8; cursor:not-allowed; }
  select, input { padding:6px 8px; border:1px solid #cbd5e1; border-radius:6px; font-size:13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .btn { padding:8px 14px; border:none; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; }
  .btn.reject { background:#fee2e2; color:var(--red); }
  .btn.confirm { background:var(--green); color:#fff; }
  .cal-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:6px; max-height:320px; overflow-y:auto; }
  .slot { padding:8px 4px; border-radius:8px; font-size:11px; text-align:center; cursor:pointer; }
  .slot.open { background:#f1f5f9; color:#475569; }
  .slot.booked { background:#dcfce7; color:var(--green); }
  .slot.blocked { background:#fee2e2; color:var(--red); }
  .gate { max-width:360px; margin:80px auto; text-align:center; }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2>管理者パスワード</h2>
  <input type="password" id="gate-secret" placeholder="ADMIN_SECRET" style="width:100%;padding:10px;margin-top:10px;" />
  <button class="btn confirm" style="margin-top:10px;width:100%;" onclick="enterAdmin()">入る</button>
</div>

<div id="app" style="display:none;">
<header><h1>GAKU 先生用スケジュール管理</h1></header>
<div class="wrap">

  <section>
    <h2>📋 ウェイトリスト（未確定の予約希望）</h2>
    <div id="waitlist-list"><p>読み込み中…</p></div>
  </section>

  <section>
    <h2>📅 空き状況カレンダー（今後14日・JST）</h2>
    <div class="row">
      <input type="date" id="block-date" />
      <input type="time" id="block-time" step="1800" />
      <input type="text" id="block-label" placeholder="メモ（任意）" />
      <button class="btn reject" onclick="blockSlot()">この枠をブロック</button>
    </div>
    <div class="cal-grid" id="cal-grid" style="margin-top:14px;"></div>
  </section>

  <section>
    <h2>🎓 Official Students 名簿</h2>
    <div id="official-list"></div>
    <div class="row">
      <input type="text" id="off-name" placeholder="名前" />
      <input type="email" id="off-email" placeholder="メール" />
      <input type="text" id="off-notes" placeholder="メモ（固定スケジュール等）" />
      <button class="btn confirm" onclick="addOfficialStudent()">追加</button>
    </div>
  </section>

</div>
</div>

<script>
let SECRET = "";
const PLAN_LINKS = {
  "3mo_30min": { label: "3 MONTHS · 30min/mo — $68.95", url: "https://buy.stripe.com/7sYcN53aGf3y9F3ct4bMQ06" },
  "3mo_1hr":   { label: "3 MONTHS · 1hr/mo — $95.20",   url: "https://buy.stripe.com/6oU8wP6mS6x23gF8cObMQ07" },
  "6mo_30min": { label: "6 MONTHS · 30min/mo — $133.45", url: "https://buy.stripe.com/dRm3cvaD8f3y18x0KmbMQ04" },
  "6mo_1hr":   { label: "6 MONTHS · 1hr/mo — $185.95",   url: "https://buy.stripe.com/9B628rcLg7B6eZn0KmbMQ05" },
};

function enterAdmin() {
  SECRET = document.getElementById("gate-secret").value.trim();
  if (!SECRET) return;
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  loadWaitlist();
  loadAvailabilityGrid();
  loadOfficialStudents();
}

async function api(action, extra = {}) {
  const resp = await fetch("/api/schedule", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ secret: SECRET, action, ...extra })
  });
  if (resp.status === 401) { alert("パスワードが違います"); location.reload(); }
  return resp.json();
}

function fmtDT(dateStr, timeStr) {
  return `${dateStr} ${timeStr.slice(0,5)} (JST)`;
}

async function loadWaitlist() {
  const data = await api("list-waitlist");
  const el = document.getElementById("waitlist-list");
  const pending = (data.requests || []).filter(r => r.status === "pending");
  if (pending.length === 0) { el.innerHTML = "<p>現在、保留中のリクエストはありません。</p>"; return; }

  // 空き状況を先に取得して〇✕判定に使う
  const avail = await api("list-availability");
  const takenSet = new Set((avail.slots || []).map(s => `${s.lesson_date}_${s.start_time.slice(0,5)}`));

  el.innerHTML = pending.map(r => {
    const opts = [1,2,3].map(n => {
      const d = r[`option${n}_date`], t = r[`option${n}_time`];
      if (!d || !t) return "";
      const isTaken = takenSet.has(`${d}_${t.slice(0,5)}`);
      const label = ["First option:","Second option:","Third option:"][n-1];
      return `<div class="opt-row">
        <span>${label}</span>
        <button class="opt-btn ${isTaken ? "taken" : "avail"}" ${isTaken ? "disabled" : ""}
          onclick="confirmBooking('${r.id}', ${n})">${fmtDT(d,t)}</button>
      </div>`;
    }).join("");

    const planInfo = PLAN_LINKS[r.plan_key];
    return `<div class="req-card">
      <div class="req-head">
        <span>${r.student_name} (${r.student_email})</span>
        <span class="badge pending">pending</span>
      </div>
      <div style="font-size:12px;color:#64748b;margin:4px 0;">プラン: ${planInfo ? planInfo.label : (r.plan_key || "不明")}</div>
      ${opts}
      <div class="row">
        <button class="btn reject" onclick="rejectWaitlist('${r.id}')">空き枠なし（お断り）</button>
      </div>
    </div>`;
  }).join("");
}

async function confirmBooking(waitlistId, chosenOption) {
  if (!confirm("この日時で確定してよいですか？生徒にメールが送信されます。")) return;
  // planKeyから対応するStripeリンクを探す（見つからなければ空欄でOK、後で手動送付）
  const req = (await api("list-waitlist")).requests.find(r => r.id === waitlistId);
  const planInfo = req ? PLAN_LINKS[req.plan_key] : null;
  await api("confirm-booking", { waitlistId, chosenOption, stripeLink: planInfo ? planInfo.url : "" });
  loadWaitlist(); loadAvailabilityGrid();
}

async function rejectWaitlist(waitlistId) {
  if (!confirm("このリクエストをお断りしてよいですか？生徒に案内メールが送信されます。")) return;
  await api("reject-waitlist", { waitlistId });
  loadWaitlist();
}

async function loadAvailabilityGrid() {
  const data = await api("list-availability");
  const grid = document.getElementById("cal-grid");
  const map = {};
  (data.slots || []).forEach(s => { map[`${s.lesson_date}_${s.start_time.slice(0,5)}`] = s; });

  const HOURS = ["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00"];
  let html = "";
  for (let i = 0; i < 14; i++) {
    const d = new Date(Date.now() + i * 86400000);
    const dateStr = d.toISOString().slice(0,10);
    HOURS.forEach(time => {
      const key = `${dateStr}_${time}`;
      const slot = map[key];
      const status = slot ? slot.status : "open";
      const labelExtra = slot && slot.label ? ` — ${slot.label}` : "";
      html += `<div class="slot ${status}" title="クリックでブロック解除/ブロック"
        onclick="toggleSlot('${dateStr}','${time}','${status}')">${dateStr.slice(5)} ${time}${labelExtra}</div>`;
    });
  }
  grid.innerHTML = html;
}

async function toggleSlot(date, time, status) {
  if (status === "open") {
    await api("block-slot", { date, time, durationMinutes: 60, label: "" });
  } else if (status === "blocked") {
    await api("unblock-slot", { date, time });
  } else {
    alert("予約済みの枠です。ウェイトリスト一覧またはOfficial Students欄から管理してください。");
    return;
  }
  loadAvailabilityGrid();
}

async function blockSlot() {
  const date = document.getElementById("block-date").value;
  const time = document.getElementById("block-time").value;
  const label = document.getElementById("block-label").value;
  if (!date || !time) return alert("日付と時間を入力してください");
  await api("block-slot", { date, time: time + ":00", durationMinutes: 60, label });
  loadAvailabilityGrid();
}

async function loadOfficialStudents() {
  const data = await api("list-official-students");
  const el = document.getElementById("official-list");
  el.innerHTML = (data.students || []).map(s =>
    `<div class="req-card"><strong>${s.name}</strong> — ${s.email}${s.notes ? " — " + s.notes : ""}</div>`
  ).join("") || "<p>まだ登録されていません。</p>";
}

async function addOfficialStudent() {
  const name = document.getElementById("off-name").value.trim();
  const email = document.getElementById("off-email").value.trim();
  const notes = document.getElementById("off-notes").value.trim();
  if (!name || !email) return alert("名前とメールを入力してください");
  await api("add-official-student", { name, email, notes });
  document.getElementById("off-name").value = "";
  document.getElementById("off-email").value = "";
  document.getElementById("off-notes").value = "";
  loadOfficialStudents();
}
</script>
</body>
</html>
