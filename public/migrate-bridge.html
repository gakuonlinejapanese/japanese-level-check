<!doctype html>
<html>
<head><meta charset="utf-8" /><title>GAKU migration bridge</title></head>
<body>
<script>
  // This page's only job: when asked (via postMessage) by a trusted GAKU
  // domain, hand over this browser's localStorage contents so a student's
  // study data can follow them when they switch domains (e.g. custom domain
  // rollout). It never runs any UI and never sends data anywhere except back
  // to the exact origin that asked, and only to domains on the allow-list.
  var ALLOWED_ORIGINS = [
    "https://app.seitojapanese.online",
    "https://japanese-level-check.vercel.app"
  ];

  window.addEventListener("message", function (evt) {
    if (ALLOWED_ORIGINS.indexOf(evt.origin) === -1) return;
    if (!evt.data || evt.data.type !== "GAKU_MIGRATE_REQUEST") return;

    var entries = {};
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      entries[k] = localStorage.getItem(k);
    }
    evt.source.postMessage({ type: "GAKU_MIGRATE_RESPONSE", entries: entries }, evt.origin);
  });
</script>
</body>
</html>
