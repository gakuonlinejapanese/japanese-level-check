name: Android build

# 手動で実行(GitHub の Actions タブ → Android build → Run workflow)
on:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build web app
        env:
          REACT_APP_SUPABASE_URL: https://hsulsdgrnaxueiwcflyk.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzdWxzZGdybmF4dWVpd2NmbHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTYxMzQsImV4cCI6MjA5NjMzMjEzNH0.dYhEtkkB1STVqYL7edihqt0o3-avpmeWC8qGFpZbZyA
          REACT_APP_RC_ANDROID_KEY: ${{ secrets.REACT_APP_RC_ANDROID_KEY }}
        run: CI=false DISABLE_ESLINT_PLUGIN=true npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gaku-master-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  release-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build web app
        env:
          REACT_APP_SUPABASE_URL: https://hsulsdgrnaxueiwcflyk.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzdWxzZGdybmF4dWVpd2NmbHlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTYxMzQsImV4cCI6MjA5NjMzMjEzNH0.dYhEtkkB1STVqYL7edihqt0o3-avpmeWC8qGFpZbZyA
          REACT_APP_RC_ANDROID_KEY: ${{ secrets.REACT_APP_RC_ANDROID_KEY }}
        run: CI=false DISABLE_ESLINT_PLUGIN=true npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Restore upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed release bundle (AAB)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: gaku-master-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
      # zip を介さずに .aab を直接ダウンロードできるよう、専用ブランチ aab-drop に置く(一時的)
      - name: Publish AAB to aab-drop branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          fail() { echo "::error title=aab-drop::$1"; exit 1; }
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab 2>&1 | head -n 1)
          [ -f "$AAB" ] || fail "AAB not found: $AAB"
          DROP="$RUNNER_TEMP/aabdrop"
          mkdir -p "$DROP"
          cp "$AAB" "$DROP/gaku-master-release.aab" || fail "copy failed"
          cd "$DROP"
          git init -q -b aab-drop 2>&1 || git init -q 2>&1 || fail "git init failed"
          git checkout -q -B aab-drop 2>&1 || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add gaku-master-release.aab
          git commit -q -m "AAB from run ${{ github.run_number }} (versionCode ${{ github.run_number }})" 2>&1 || fail "git commit failed"
          OUT=$(git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" aab-drop 2>&1) && RC=0 || RC=$?
          echo "$OUT"
          [ $RC -eq 0 ] || fail "git push failed (rc=$RC): $(echo "$OUT" | tr '\n' ' ' | cut -c1-400)"
