name: iOS build (TestFlight)

# 手動で実行(GitHub の Actions タブ → iOS build (TestFlight) → Run workflow)
# ios-setup ブランチの iOS プロジェクトを署名してビルドし、App Store Connect(TestFlight)へアップロードします。
# 署名は App Store Connect API キーを使って Apple のクラウド側で自動管理します(Mac に証明書は不要)。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "ビルドするブランチ"
        default: ios-setup
        required: true

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: AU6SAKRBDG
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      # config.xml と capacitor.config.json は Git に入らない自動生成ファイルのため、
      # Web アプリをビルド → cap sync で生成し、プラグインを ios/vendor に取り込み直します。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        run: CI=false DISABLE_ESLINT_PLUGIN=true npm run build

      - name: Sync Capacitor (generates config files)
        run: |
          npx cap sync ios
          sh scripts/vendor-ios-plugins.sh
          ls -l ios/App/App/capacitor.config.json ios/App/App/config.xml

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # アーカイブ時は署名しない(開発用プロファイルはデバイス登録が必要で失敗するため)。
      # 配布用の署名は、次の Export のステップで Apple のクラウド側が自動で行います。
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Show errors (only when a step failed)
        if: failure()
        run: |
          {
            echo "## ビルドエラーの要点(この内容をClaudeに貼ってください)"
            for f in archive export; do
              if [ -f "$RUNNER_TEMP/$f.log" ]; then
                echo "### $f.log"
                echo '```'
                grep -nE "error:|warning: .*(sign|profile|provision)|\*\* .* FAILED \*\*|Could not|No profile|requires a development team|Cannot" "$RUNNER_TEMP/$f.log" | head -40
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for f in archive export; do
            [ -f "$RUNNER_TEMP/$f.log" ] && grep -m5 -E "error:" "$RUNNER_TEMP/$f.log" | while read -r line; do echo "::error::$line"; done
          done || true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log

      - name: Remove API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
