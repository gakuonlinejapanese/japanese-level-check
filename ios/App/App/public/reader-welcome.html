<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GAKU Reader へようこそ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --red: #E8382F;
    --dark: #1a1a2e;
    --gold: #f5a623;
    --green: #27ae60;
    --gray: #6b7280;
    --border: #e5e7eb;
    --light: #f8f6f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
    background: var(--light);
    color: var(--dark);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
  .badge {
    display: inline-block;
    background: var(--dark);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 6px 14px;
    border-radius: 99px;
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 30px;
    line-height: 1.4;
    margin-bottom: 12px;
  }
  .sub { color: var(--gray); font-size: 15px; line-height: 1.8; margin-bottom: 32px; }
  .step {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .step-num {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--red);
    color: #fff;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .step-body h3 { font-size: 15px; margin-bottom: 4px; }
  .step-body p { font-size: 13.5px; color: var(--gray); line-height: 1.7; }
  .demo-box {
    background: #fff;
    border: 2px dashed var(--red);
    border-radius: 16px;
    padding: 28px 24px;
    margin: 32px 0;
    position: relative;
  }
  .demo-label {
    position: absolute;
    top: -13px;
    left: 20px;
    background: var(--red);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 4px 12px;
    border-radius: 99px;
  }
  .demo-text {
    font-family: 'Noto Serif JP', serif;
    font-size: 21px;
    line-height: 2.3;
    color: var(--dark);
  }
  .demo-hint {
    margin-top: 18px;
    font-size: 13px;
    color: var(--gray);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .arrow-bounce { display: inline-block; animation: bounce 1.4s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }
  .cta {
    text-align: center;
    background: var(--dark);
    color: #fff;
    border-radius: 16px;
    padding: 30px 24px;
    margin-top: 36px;
  }
  .cta h2 { font-family: 'Noto Serif JP', serif; font-size: 20px; margin-bottom: 8px; }
  .cta p { font-size: 13.5px; color: #cbd5e1; margin-bottom: 20px; line-height: 1.7; }
  .cta a {
    display: inline-block;
    background: var(--red);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    padding: 13px 28px;
    border-radius: 10px;
  }
  .lang-switch {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
  }
  .lang-switch select {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--dark);
  }
</style>
</head>

    function detectLang() {
      var saved = localStorage.getItem("gaku_reader_welcome_lang");
      if (saved && T[saved]) return saved;
      var nav = (navigator.language || navigator.userLanguage || "en").toLowerCase();
      if (nav.indexOf("ja") === 0) return "ja";
      if (nav.indexOf("es") === 0) return "es";
      if (nav.indexOf("fr") === 0) return "fr";
      if (nav.indexOf("de") === 0) return "de";
      if (nav.indexOf("ko") === 0) return "ko";
      if (nav.indexOf("zh") === 0) return (nav.indexOf("tw") !== -1 || nav.indexOf("hk") !== -1 || nav.indexOf("hant") !== -1) ? "zh-Hant" : "zh-Hans";
      if (nav.indexOf("th") === 0) return "th";
      if (nav.indexOf("vi") === 0) return "vi";
      if (nav.indexOf("id") === 0) return "id";
      if (nav.indexOf("hi") === 0) return "hi";
      if (nav.indexOf("tr") === 0) return "tr";
      if (nav.indexOf("ne") === 0) return "ne";
      if (nav.indexOf("fil") === 0 || nav.indexOf("tl") === 0) return "fil";
      if (nav.indexOf("ms") === 0) return "ms";
      if (nav.indexOf("it") === 0) return "it";
      return "en";
    }

    function applyLang(lang) {
      var t = T[lang] || T.en;
      document.getElementById("t-badge").textContent = t.badge;
      document.getElementById("t-h1").textContent = t.h1;
      document.getElementById("t-sub").textContent = t.sub;
      document.getElementById("t-step1h").textContent = t.step1h;
      document.getElementById("t-step1p").textContent = t.step1p;
      document.getElementById("t-step2h").textContent = t.step2h;
      document.getElementById("t-step2p").textContent = t.step2p;
      document.getElementById("t-step3h").textContent = t.step3h;
      document.getElementById("t-step3p").textContent = t.step3p;
      document.getElementById("t-demoLabel").textContent = t.demoLabel;
      document.getElementById("t-demoText").textContent = DEMO_TEXT;
      document.getElementById("t-demoHint").textContent = t.demoHint;
      document.getElementById("t-ctaH2").textContent = t.ctaH2;
      document.getElementById("t-ctaP").textContent = t.ctaP;
      document.getElementById("t-ctaLink").textContent = t.ctaLink;
      document.getElementById("t-footnote").textContent = t.footnote;
      document.getElementById("lang-select").value = lang;
      document.documentElement.lang = lang.indexOf("zh") === 0 ? "zh" : lang;
      localStorage.setItem("gaku_reader_welcome_lang", lang);
    }

    (function init() {
      var sel = document.getElementById("lang-select");
      Object.keys(LANG_NAMES).forEach(function (code) {
        var opt = document.createElement("option");
        opt.value = code;
        opt.textContent = LANG_NAMES[code];
        sel.appendChild(opt);
      });
      applyLang(detectLang());
    })();
  </script>
